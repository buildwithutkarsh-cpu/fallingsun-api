<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wide">
<div id="nav"></div>
<h1>Leaderboard</h1>
<div class="row">Category: <select id="cat"><option value="">All</option><option value="game">Game</option><option value="web">Web</option><option value="robotics">Robotics</option></select></div>
<p id="status"></p>
<table id="board"></table>
<div id="dq"></div>
</div>
<script src="/app.js"></script>
<script>
renderNav();
async function load() {
  const d = await api('/leaderboard' + (cat.value ? '?category=' + cat.value : ''));
  document.getElementById('status').textContent = d.voting_open ? 'Voting is open' : 'Voting is closed';
  document.getElementById('board').innerHTML = '<tr><th>#</th><th>Team</th><th>Category</th><th>Trial /25</th><th>Presentation /25</th><th>Jury rating /25</th><th>Leaders /25</th><th>Total /100</th></tr>' +
    d.ranked.map((r) => '<tr><td>' + r.rank + '</td><td><a href="/team/' + r.team_id + '">' + esc(r.team) + '</a>' +
      (r.standing === 'at_risk' ? '<br>(leader must rate ' + (r.min_required - r.projects_rated_by_leader) + ' more)' : '') + '</td><td>' + r.category + '</td><td>' + r.trial + '</td><td>' + r.presentation + '</td><td>' + r.jury_rating + '</td><td>' + r.leader_vote + '</td><td>' + r.total + '</td></tr>').join('');
  document.getElementById('dq').innerHTML = d.disqualified.length
    ? '<h2>Disqualified</h2><table><tr><th>Team</th><th>Rated</th><th>Required</th></tr>' + d.disqualified.map((r) => '<tr><td>' + esc(r.team) + '</td><td>' + r.projects_rated_by_leader + '</td><td>' + r.min_required + '</td></tr>').join('') + '</table>'
    : '';
}
cat.onchange = load;
load();
setInterval(load, 15000);
</script>
</body></html>
