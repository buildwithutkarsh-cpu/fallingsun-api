<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wide">
<div id="nav"></div>
<h1>Projects</h1>
<div id="notice"></div>
<div class="row">Category: <select id="cat"><option value="">All</option><option value="game">Game</option><option value="web">Web</option><option value="robotics">Robotics</option></select></div>
<p id="mine"></p>
<table id="list"></table>
</div>
<script src="/app.js"></script>
<script>
let u = null, voted = {};
function canVote(t) {
  if (!u) return '';
  if (u.role === 'jury') return 'yes';
  if (!u.team) return 'register first';
  if (u.team.id === t.id) return 'own project';
  if (u.team.status === 'robotics_eliminated') return 'transfer first';
  return u.team.category === t.category ? 'yes' : 'other category';
}
async function load() {
  const t = await api('/teams' + (cat.value ? '?category=' + cat.value : ''));
  document.getElementById('list').innerHTML = '<tr><th>Team</th><th>Project</th><th>Category</th>' + (u ? '<th>You can vote</th><th>You voted</th>' : '') + '<th></th></tr>' +
    t.teams.map((x) => '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.project_title) + '</td><td>' + x.category + '</td>' +
      (u ? '<td>' + canVote(x) + '</td><td>' + (voted[x.id] ? 'yes' : '-') + '</td>' : '') +
      '<td><a href="/team/' + x.id + '">Open</a></td></tr>').join('');
}
async function transfer(to) {
  try { await api('/teams/me/transfer', 'POST', { category: to }); location.reload(); } catch (e) { alert(e.message); }
}
(async () => {
  u = await renderNav();
  if (u) {
    try {
      const v = await api('/votes/mine');
      v.votes.forEach((x) => (voted[x.team_id] = true));
      document.getElementById('mine').textContent = 'Projects you have rated: ' + v.count;
    } catch (e) {}
    if (u.role === 'leader' && u.team && u.team.status === 'robotics_eliminated')
      document.getElementById('notice').innerHTML = '<div class="box"><p>Your team was not selected for the robotics round. Move to:</p><button onclick="transfer(\'web\')">Web Dev</button> <button onclick="transfer(\'game\')">Game Dev</button></div>';
    if (u.role === 'leader' && !u.team)
      document.getElementById('notice').innerHTML = '<div class="box"><p>Register your team first to start voting.</p><a href="/register.html">Register team</a></div>';
  }
  cat.onchange = load;
  load();
})();
</script>
</body></html>
